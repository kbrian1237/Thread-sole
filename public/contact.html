<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Thread & Sole</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="modern-nav"></header>
    <div class="floating-cart" id="floating-cart">
        <div class="cart-header"><h3>Your Bag</h3><button class="close-cart"><i class="fas fa-times"></i></button></div>
        <div id="cart-items"></div>
        <div class="cart-footer"><div class="cart-total"><span>Total:</span><span class="total-amount">$0.00</span></div><button class="checkout-btn">Checkout</button></div>
    </div>
    <section class="page-header">
        <div class="container"><h1>Contact Us</h1><p>Everyday fashion for modern living</p></div>
    </section>
    <main class="container section">
        <div style="max-width: 600px; margin: 0 auto;">
            <form id="contact-form" style="display: flex; flex-direction: column; gap: 15px">
                <div class="form-group">
                    <label style="display:block; margin-bottom:5px">Name</label>
                    <input type="text" name="name" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px">
                </div>
                <div class="form-group">
                    <label style="display:block; margin-bottom:5px">Email</label>
                    <input type="email" name="email" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px">
                </div>
                <div class="form-group">
                    <label style="display:block; margin-bottom:5px">Message</label>
                    <textarea name="message" rows="5" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px"></textarea>
                </div>
                <button type="submit" style="padding:15px; background:var(--primary); color:white; border-radius:4px; font-weight:bold">Send Message</button>
            </form>
            <div id="form-response" style="margin-top: 20px; display: none; padding: 15px; border-radius: 4px; background: #e7f3ff; color: #004085"></div>
        </div>
    </main>
    <script>
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const responseDiv = document.getElementById('form-response');

            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                responseDiv.textContent = result.message;
                responseDiv.style.display = 'block';
                e.target.reset();
            } catch (err) {
                responseDiv.textContent = 'Something went wrong. Please try again.';
                responseDiv.style.display = 'block';
            }
        });
    </script>
    <footer class="modern-footer"></footer>
    <button class="back-to-top" id="back-to-top"><i class="fas fa-arrow-up"></i></button>
    <script src="js/app.js"></script>
</body>
</html>
